<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SERVPLUS Office</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="side" id="side">
  <div class="brand">
    <div class="brand-name">SERVPLUS</div>
    <div class="brand-sub">Office Management CRM</div>
  </div>
  <nav id="nav"></nav>
  <a class="nav-item nav-help" href="#/help"><span class="ni">❓</span>Help &amp; Training</a>
</aside>
<div class="wrap">
  <header class="top">
    <button class="menu-btn" data-action="toggleMenu" aria-label="Menu">☰</button>
    <div class="hello">
      <div class="hello-big" id="helloBig">Good morning!</div>
      <div class="hello-sub" id="helloSub"></div>
    </div>
    <div class="search">
      <span>🔍</span>
      <input id="search" placeholder="Search company information (vendors, contacts, procedures, forms…)" autocomplete="off">
      <div class="search-res" id="searchRes"></div>
    </div>
    <button class="btn pri scan-top" data-action="scanStart">📄 Scan anything</button>
    <button class="bell" data-go="#/approvals" title="Waiting on the owner">🔔<span id="bellN" class="bell-n"></span></button>
    <div class="me"><span class="me-ico">OM</span><span class="me-name">Office Manager</span></div>
  </header>
  <main id="main"></main>
</div>
<aside class="hp" id="helper"></aside>
<button class="hp-open" id="hpOpen" data-action="hpShow" title="Open your assistant">✨</button>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
<script src="scan.js"></script>
<script src="helper.js"></script>
</body>
</html>
